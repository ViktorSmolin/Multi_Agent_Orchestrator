worker_processes 1;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=mao_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=mao_conn:10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream mao_engines {
        zone mao_engines 64k;
        server engine-1:8090 resolve max_fails=1 fail_timeout=15s;
        server engine-2:8090 resolve max_fails=1 fail_timeout=15s;
    }

    log_format mao '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /dev/stdout mao;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 8090;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        include /etc/nginx/mao-proxy.conf;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        include /etc/nginx/mao-proxy.conf;
    }
}
