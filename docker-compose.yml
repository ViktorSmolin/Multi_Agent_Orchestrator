name: multi-agent-orchestrator

x-engine-environment: &engine-environment
  NODE_ENV: production
  ENGINE_PORT: 8090
  DB_RETRY_DELAY_MS: ${DB_RETRY_DELAY_MS:-2000}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  MAO_API_KEY: ${MAO_API_KEY}
  TASK_CLAIM_IDLE_MS: ${TASK_CLAIM_IDLE_MS:-60000}
  TASK_CLAIM_BLOCK_MS: ${TASK_CLAIM_BLOCK_MS:-5000}

x-engine: &engine
  build:
    context: .
    dockerfile: core-engine/${ENGINE_DOCKERFILE:-Dockerfile}
  restart: unless-stopped
  init: true
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "src/healthcheck.js"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  security_opt:
    - no-new-privileges:true
  labels:
    mao.autoheal: "true"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - core

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mao-db
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      mao.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core

  redis:
    image: redis:7-alpine
    container_name: mao-redis
    restart: unless-stopped
    init: true
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      mao.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core

  engine-1:
    <<: *engine
    container_name: mao-engine-1
    environment:
      <<: *engine-environment
      ENGINE_SERVICE_NAME: core-engine-1
      ENGINE_INSTANCE_ID: engine-1

  engine-2:
    <<: *engine
    container_name: mao-engine-2
    environment:
      <<: *engine-environment
      ENGINE_SERVICE_NAME: core-engine-2
      ENGINE_INSTANCE_ID: engine-2

  cert-generator:
    image: python:3.12-slim
    container_name: mao-cert-generator
    command: ["sh", "/certs/generate-certs.sh"]
    restart: "no"
    volumes:
      - ./gateway/generate-certs.sh:/certs/generate-certs.sh:ro
      - gateway_certs:/certs
    security_opt:
      - no-new-privileges:true
    network_mode: none

  gateway:
    image: nginx:1.27-alpine
    container_name: mao-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8090}:8090"
      - "127.0.0.1:${GATEWAY_TLS_PORT:-8443}:8443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/mao-proxy.conf:/etc/nginx/mao-proxy.conf:ro
      - gateway_certs:/etc/nginx/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      engine-1:
        condition: service_healthy
      engine-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      mao.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core

  task-executor:
    build:
      context: .
      dockerfile: agents/task_executor/Dockerfile
    container_name: mao-task-executor
    restart: unless-stopped
    init: true
    environment:
      MAO_WS_URL: ws://gateway:8090/ws
      MAO_HTTP_URL: http://gateway:8090
      MAO_API_KEY: ${MAO_API_KEY}
      MAO_AGENT_ID: ${MAO_AGENT_ID:-task-executor-agent}
      MAO_CONSUME_MODE: ${MAO_CONSUME_MODE:-group}
      TASK_CLAIM_BLOCK_MS: ${TASK_CLAIM_BLOCK_MS:-5000}
      TASK_CLAIM_IDLE_MS: ${TASK_CLAIM_IDLE_MS:-60000}
      TASK_EXECUTION_DELAY_SECONDS: ${TASK_EXECUTION_DELAY_SECONDS:-2}
      ACK_TIMEOUT_SECONDS: ${ACK_TIMEOUT_SECONDS:-10}
      HANDSHAKE_TIMEOUT_SECONDS: ${HANDSHAKE_TIMEOUT_SECONDS:-10}
      RECONNECT_BASE_SECONDS: ${RECONNECT_BASE_SECONDS:-1}
      RECONNECT_MAX_SECONDS: ${RECONNECT_MAX_SECONDS:-30}
      AGENT_HEALTH_PORT: ${AGENT_HEALTH_PORT:-8091}
      HEALTH_PING_INTERVAL_SECONDS: ${HEALTH_PING_INTERVAL_SECONDS:-10}
      HEALTH_MAX_ACTIVITY_AGE_SECONDS: ${HEALTH_MAX_ACTIVITY_AGE_SECONDS:-30}
      AGENT_STATE_DIR: /app/state
      OUTBOX_RETRY_INTERVAL_SECONDS: ${OUTBOX_RETRY_INTERVAL_SECONDS:-2}
      OUTBOX_MAX_BACKOFF_SECONDS: ${OUTBOX_MAX_BACKOFF_SECONDS:-30}
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - agent_state:/app/state
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      mao.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core

  task-executor-2:
    profiles: ["scale"]
    build:
      context: .
      dockerfile: agents/task_executor/Dockerfile
    container_name: mao-task-executor-2
    restart: unless-stopped
    init: true
    environment:
      MAO_WS_URL: ws://gateway:8090/ws
      MAO_HTTP_URL: http://gateway:8090
      MAO_API_KEY: ${MAO_API_KEY}
      MAO_AGENT_ID: task-executor-agent-2
      MAO_CONSUME_MODE: group
      TASK_CLAIM_BLOCK_MS: ${TASK_CLAIM_BLOCK_MS:-5000}
      TASK_CLAIM_IDLE_MS: ${TASK_CLAIM_IDLE_MS:-60000}
      TASK_EXECUTION_DELAY_SECONDS: ${TASK_EXECUTION_DELAY_SECONDS:-2}
      ACK_TIMEOUT_SECONDS: ${ACK_TIMEOUT_SECONDS:-10}
      HANDSHAKE_TIMEOUT_SECONDS: ${HANDSHAKE_TIMEOUT_SECONDS:-10}
      RECONNECT_BASE_SECONDS: ${RECONNECT_BASE_SECONDS:-1}
      RECONNECT_MAX_SECONDS: ${RECONNECT_MAX_SECONDS:-30}
      AGENT_HEALTH_PORT: 8091
      HEALTH_PING_INTERVAL_SECONDS: ${HEALTH_PING_INTERVAL_SECONDS:-10}
      HEALTH_MAX_ACTIVITY_AGE_SECONDS: ${HEALTH_MAX_ACTIVITY_AGE_SECONDS:-30}
      AGENT_STATE_DIR: /app/state
      OUTBOX_RETRY_INTERVAL_SECONDS: ${OUTBOX_RETRY_INTERVAL_SECONDS:-2}
      OUTBOX_MAX_BACKOFF_SECONDS: ${OUTBOX_MAX_BACKOFF_SECONDS:-30}
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - agent_state_2:/app/state
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      mao.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core

  autoheal:
    image: node:20-alpine
    container_name: mao-autoheal
    restart: unless-stopped
    init: true
    command: ["node", "/app/autoheal.js"]
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      AUTOHEAL_INTERVAL_MS: ${AUTOHEAL_INTERVAL_MS:-15000}
      AUTOHEAL_COOLDOWN_MS: ${AUTOHEAL_COOLDOWN_MS:-60000}
      AUTOHEAL_HEALTH_PORT: ${AUTOHEAL_HEALTH_PORT:-8092}
    volumes:
      - ./scripts/autoheal.js:/app/autoheal.js:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    container_name: mao-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      engine-1:
        condition: service_healthy
      engine-2:
        condition: service_healthy
    networks:
      - core

volumes:
  pgdata:
    name: mao_pgdata
  agent_state:
    name: mao_agent_state
  agent_state_2:
    name: mao_agent_state_2
  redisdata:
    name: mao_redisdata
  gateway_certs:
    name: mao_gateway_certs
  prometheus_data:
    name: mao_prometheus_data

networks:
  core:
    name: mao-core
    driver: bridge
